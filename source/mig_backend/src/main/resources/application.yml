server:
  port: 8091
  servlet:
    context-path: /mip

spring:
  application:
    name: mig-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MIP_DB_URL:jdbc:mysql://192.168.88.132:3306/mip_gateway?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${MIP_DB_USERNAME:xz_feng}
    password: ${MIP_DB_PASSWORD:Feng123456!}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO

# ===== 前置机业务参数 =====
mip:
  # 医保局平台（开发期=csmis mock；生产期=真实医保局地址）
  upstream:
    base-url: ${MIP_UPSTREAM_URL:http://localhost:8090/mss}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  # 加签加密开关（开发期false=透传明文；生产期true=加SM2签名+SM4加密）
  crypto:
    enabled: false
    # TODO: 生产期配置CA证书路径、医保局公钥、SM4密钥等
  # ===== 登录鉴权（对齐 cslk HIS：SM2 口令加密 + BCrypt + JWT） =====
  security:
    sm2:
      # 16进制SM2私钥（64 hex字符）；留空则启动时临时生成一对（重启失效，多实例必须显式配置同一对）
      private-key: ${MIP_SM2_PRIVATE_KEY:}
      # 16进制SM2公钥（含04前缀，130 hex字符）；留空则从私钥推导
      public-key: ${MIP_SM2_PUBLIC_KEY:}
  jwt:
    # JWT签名密钥（生产期必须通过环境变量覆盖）
    secret: ${MIP_JWT_SECRET:mip-gateway-jwt-secret-change-me-in-prod-2026}
    # 会话有效期（毫秒），默认24小时
    expiration: ${MIP_JWT_EXPIRATION:86400000}

logging:
  level:
    com.mip: debug

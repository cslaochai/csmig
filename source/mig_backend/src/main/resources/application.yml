server:
  port: 8091
  servlet:
    context-path: /mig

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: mig-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      connection-test-query: SELECT 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO

# ===== 前置机业务参数 =====
mig:
  upstream:
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  # 加签加密开关（true=SM2签名+SM4加密+CSSSL证书双向验签；false=透传明文，开发期）
  crypto:
    enabled: ${MIG_CRYPTO_ENABLED:true}
    private-key: classpath:crypto/csmig-private.pem
    cert-chain: classpath:crypto/csmig-cert.pem
    root-ca: classpath:crypto/root-ca.pem
    sub-ca: classpath:crypto/sub-ca.pem
    clock-skew-seconds: 300
  # ===== 登录鉴权（对齐 cslk HIS：SM2 口令加密 + BCrypt + JWT） =====
  jwt:
    # 会话有效期（毫秒），默认24小时；签名密钥属环境项，落 profile 文件
    expiration: 86400000

# 业务日志级别两环境同值，声明一次；dev 要开 SQL 调试就在 application-dev.yml 里覆盖成 debug
logging:
  level:
    com.mig: info
